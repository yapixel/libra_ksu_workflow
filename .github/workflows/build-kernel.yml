name: Build Libra/Aqua Kernel with KSU

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repository'
        required: true
        default: 'yapixel/android_kernel_xiaomi_libra'
        type: string
      kernel_branch:
        description: 'Kernel branch to build'
        required: true
        default: 'personal'
        type: choice
        options:
          - 'personal'
          - 'personal-susfs-2.3.0'
          - 'lineage-18.1'
      clang_tag:
        description: 'Greenforce Clang release tag (default: 20260531 for Clang 22)'
        required: true
        default: '20260531'
        type: string
      upload_release:
        description: 'Publish build as GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - susfs: false
            flavor: "without-susfs"
            name: "Non-SuSFS"
          - susfs: true
            flavor: "with-susfs"
            name: "SuSFS"
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ca-certificates ccache cpio curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            git jq libelf-dev libssl-dev make python3 zip xz-utils patch

      - name: Fetch Toolchain (Greenforce Clang)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"
          TAG="${{ inputs.clang_tag || '20260531' }}"
          DOWNLOAD_URL=$(curl -s "https://api.github.com/repos/greenforce-project/greenforce_clang/releases/tags/$TAG" \
            | jq -r '.assets[] | select(.name | test("gf-clang.*\\.tar\\.gz$")) | .browser_download_url' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Specified tag not found, falling back to latest Greenforce Clang release"
            DOWNLOAD_URL=$(curl -s "https://api.github.com/repos/greenforce-project/greenforce_clang/releases/latest" \
              | jq -r '.assets[] | select(.name | test("gf-clang.*\\.tar\\.gz$")) | .browser_download_url' | head -n 1)
          fi

          echo "Downloading Clang from: $DOWNLOAD_URL"
          curl -L "$DOWNLOAD_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kernel_repo || 'yapixel/android_kernel_xiaomi_libra' }}
          ref: ${{ inputs.kernel_branch || 'personal' }}
          path: kernel
          fetch-depth: 1

      - name: Apply KernelSU Manual Syscall Hooks & Security Hooks
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          if grep -q "ksu_legacy_execve_sucompat" fs/exec.c; then
            echo "Manual syscall hooks already present, skipping 01_ksu_manual_hooks.patch"
          else
            echo "Applying 01_ksu_manual_hooks.patch..."
            patch -p1 < "$GITHUB_WORKSPACE/patches/01_ksu_manual_hooks.patch"
          fi

          if grep -q "ksu_bprm_check" security/security.c; then
            echo "Manual security hooks already present, skipping 02_ksu_manual_security_hooks.patch"
          else
            echo "Applying 02_ksu_manual_security_hooks.patch..."
            patch -p1 < "$GITHUB_WORKSPACE/patches/02_ksu_manual_security_hooks.patch"
          fi

      - name: Apply SuSFS v2.3.0 Patches
        if: ${{ matrix.susfs == true }}
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          if [ -f "fs/susfs.c" ] && grep -q "CONFIG_KSU_SUSFS" "fs/namespace.c"; then
            echo "SuSFS already integrated into kernel source, skipping patch step."
          else
            echo "Cloning yapixel/susfs4ksu (branch: kernel-3.10)..."
            git clone --depth 1 -b kernel-3.10 https://github.com/yapixel/susfs4ksu.git "$GITHUB_WORKSPACE/susfs4ksu"

            echo "Copying SuSFS core source files..."
            cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c" fs/
            cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h" include/linux/
            cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs_def.h" include/linux/

            echo "Applying SuSFS KernelSU patch..."
            cd "$GITHUB_WORKSPACE/kernel/drivers/kernelsu"
            patch -p1 < "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

            echo "Applying SuSFS kernel VFS patch..."
            cd "$GITHUB_WORKSPACE/kernel"
            patch -p1 < "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-3.10.patch"

            echo "Appending SuSFS configuration to libra_defconfig..."
            cat << 'EOF' >> arch/arm64/configs/libra_defconfig
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_ENABLE_LOG=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_SUS_MAP=y
EOF
          fi

      - name: Extract KSU & SuSFS Version from Kernel Source
        id: ksu_version
        run: |
          KSU_VER=""
          if [ -f "$GITHUB_WORKSPACE/kernel/drivers/kernelsu/Makefile" ]; then
            KSU_VER=$(grep -oP '(?<=KSU_VERSION=)[0-9]+' "$GITHUB_WORKSPACE/kernel/drivers/kernelsu/Makefile" | head -n 1 || true)
          fi
          if [ -z "$KSU_VER" ]; then
            KSU_VER="Custom"
          fi
          echo "Detected integrated KSU version: $KSU_VER"
          echo "ksu_ver=$KSU_VER" >> "$GITHUB_OUTPUT"

          SUSFS_VER=""
          if [ "${{ matrix.susfs }}" = "true" ] && [ -f "$GITHUB_WORKSPACE/kernel/include/linux/susfs.h" ]; then
            SUSFS_VER=$(grep -oP '(?<=#define SUSFS_VERSION ")[^"]+' "$GITHUB_WORKSPACE/kernel/include/linux/susfs.h" | head -n 1 || true)
          fi
          echo "Detected SuSFS version: $SUSFS_VER"
          echo "susfs_ver=$SUSFS_VER" >> "$GITHUB_OUTPUT"

      - name: Build Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "Using compiler:"
          clang --version | head -n 1

          # Configure out directory and defconfig
          mkdir -p out
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out arch/arm64/configs/libra_defconfig
          scripts/config --file out/.config -d CC_WERROR

          if [ "${{ matrix.susfs }}" != "true" ]; then
            scripts/config --file out/.config -d CONFIG_KSU_SUSFS
          fi

          # Build Image.gz-dtb matching author's build script
          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 O=out \
            CC="clang" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            LD="ld.lld" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            CROSS_COMPILE_COMPAT="arm-linux-gnueabi-" \
            LLVM=1 \
            LLVM_IAS=1 \
            INSTALL_MOD_STRIP=1 \
            Image.gz-dtb

          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Error: Image.gz-dtb was not generated!"
            exit 1
          fi

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$GITHUB_WORKSPACE/AnyKernel3"
          rm -rf "$GITHUB_WORKSPACE/AnyKernel3/.git"
          cp "$GITHUB_WORKSPACE/anykernel.sh" "$GITHUB_WORKSPACE/AnyKernel3/anykernel.sh"

          KSU_VER="${{ steps.ksu_version.outputs.ksu_ver }}"
          SUSFS_VER="${{ steps.ksu_version.outputs.susfs_ver }}"
          if [ "${{ matrix.susfs }}" = "true" ] && [ -n "$SUSFS_VER" ]; then
            sed -i -E "s/kernel\.ksuver=.*/kernel.ksuver=v${KSU_VER} (SuSFS ${SUSFS_VER})/g" "$GITHUB_WORKSPACE/AnyKernel3/anykernel.sh"
          else
            sed -i -E "s/kernel\.ksuver=.*/kernel.ksuver=v${KSU_VER}/g" "$GITHUB_WORKSPACE/AnyKernel3/anykernel.sh"
          fi

      - name: Package AnyKernel3 Zip
        id: package
        run: |
          cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" "$GITHUB_WORKSPACE/AnyKernel3/"

          KSU_VER="${{ steps.ksu_version.outputs.ksu_ver }}"
          SUSFS_VER="${{ steps.ksu_version.outputs.susfs_ver }}"
          DATE=$(date +%y%m%d)

          if [ "${{ matrix.susfs }}" = "true" ] && [ -n "$SUSFS_VER" ]; then
            ZIP_NAME="KSU_SUSFS_${SUSFS_VER}_libra_3.10.108+${KSU_VER}-${DATE}.zip"
          else
            ZIP_NAME="KSU_libra_3.10.108+${KSU_VER}-${DATE}.zip"
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$GITHUB_WORKSPACE/AnyKernel3"
          zip -r9 "$GITHUB_WORKSPACE/dist/$ZIP_NAME" * -x .git .gitignore README.md *placeholder

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_path=$GITHUB_WORKSPACE/dist/$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}

  release:
    name: Publish Release
    needs: build
    if: ${{ inputs.upload_release != false && inputs.upload_release != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Release Notes and Metadata
        id: release_info
        run: |
          DATE=$(date +%y%m%d)
          BRANCH="${{ inputs.kernel_branch || 'personal' }}"
          TAG_NAME="${DATE}-${{ github.run_number }}"
          RELEASE_NAME="Libra Kernel (${BRANCH}) + KSU [Non-SuSFS & SuSFS] - ${DATE}"

          echo "Found build packages in artifacts/:"
          ls -la artifacts/

          cat << EOF > release_body.md
## Xiaomi Mi 4c/4s (libra/aqua) Kernel Build
- **Kernel Branch**: \`${BRANCH}\`
- **Build Date**: \`${DATE}\`
- **Build Matrix**:
  - **Non-SuSFS**: Clean KernelSU 32704 with manual syscall hooks (\`fs/exec.c\`, \`fs/open.c\`, \`fs/stat.c\`) and manual security hooks v2.0 (\`security/security.c\`)
  - **SuSFS v2.3.0**: KernelSU 32704 + SuSFS v2.3.0 de-inlined engine ported from [yapixel/susfs4ksu](https://github.com/yapixel/susfs4ksu)

### Released Packages
EOF

          for f in artifacts/*.zip; do
            if [ -f "$f" ]; then
              sha=$(sha256sum "$f" | awk '{print $1}')
              size=$(du -h "$f" | awk '{print $1}')
              base=$(basename "$f")
              echo "- **\`$base\`** (${size}) - SHA256: \`$sha\`" >> release_body.md
            fi
          done

          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: release_body.md
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
